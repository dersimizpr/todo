<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapılacaklar</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1f2328; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --danger: #dc2626; --done: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --text: #e6e8eb; --muted: #9aa1ab;
      --line: #2a2f38; --accent: #60a5fa; --danger: #f87171; --done: #6b7280;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  .app { width: 100%; max-width: 560px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .date { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; padding: 0 18px; font-weight: 600;
  }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters button {
    background: transparent; color: var(--muted); padding: 6px 12px;
    border: 1px solid var(--line); font-weight: 500; font-size: 14px;
  }
  .filters button.active { color: var(--accent); border-color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card);
       border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: none; }
  li input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  li .text { flex: 1; word-break: break-word; cursor: text; }
  li.done .text { text-decoration: line-through; color: var(--done); }
  li .edit { flex: 1; padding: 6px 8px; font-size: 15px; }
  li .del {
    background: transparent; color: var(--muted); font-size: 18px; padding: 2px 8px;
    opacity: 0; transition: opacity .15s;
  }
  li:hover .del, li .del:focus { opacity: 1; }
  li .del:hover { color: var(--danger); }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .footer { display: flex; justify-content: space-between; margin-top: 12px;
            color: var(--muted); font-size: 14px; }
  .footer button { background: transparent; color: var(--muted); padding: 0; font-weight: 500; }
  .footer button:hover { color: var(--danger); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 20px; text-align: center; }
  [hidden] { display: none !important; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .user { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding-top: 8px; }
  .user button { background: transparent; color: var(--muted); border: 1px solid var(--line);
                 padding: 6px 12px; font-weight: 500; font-size: 14px; }
  .user button:hover { color: var(--danger); border-color: var(--danger); }
  .auth { display: flex; flex-direction: column; gap: 14px; background: var(--card);
          border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .auth h2 { margin: 0; font-size: 20px; }
  .auth label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  .auth input { padding: 12px 14px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line);
                background: var(--bg); color: var(--text); outline: none; }
  .auth input:focus { border-color: var(--accent); }
  .auth button[type=submit] { padding: 12px; }
  .auth button:disabled { opacity: .6; cursor: wait; }
  .auth-error { color: var(--danger); font-size: 14px; min-height: 1em; }
  .auth-switch { font-size: 14px; color: var(--muted); text-align: center; }
  .auth-switch button { background: transparent; color: var(--accent); padding: 0 4px; }
  .auth-info { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
  .auth-info b { color: var(--text); word-break: break-all; }
  #verify-code { font-size: 24px; letter-spacing: 6px; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>Yapılacaklar</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="user" id="user" hidden>
      <span id="username"></span>
      <button id="logout" type="button">Çıkış</button>
    </div>
  </div>

  <form id="auth" class="auth" hidden>
    <h2 id="auth-title">Giriş yap</h2>
    <label>E-posta
      <input type="email" id="auth-email" autocomplete="email" required>
    </label>
    <label>Şifre
      <input type="password" id="auth-pass" autocomplete="current-password" required minlength="8">
    </label>
    <label id="auth-pass2-row" hidden>Şifre (tekrar)
      <input type="password" id="auth-pass2" autocomplete="new-password" minlength="8">
    </label>
    <button type="submit" id="auth-submit">Giriş yap</button>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-switch">
      <span id="auth-switch-text">Hesabın yok mu?</span>
      <button type="button" id="auth-switch">Kayıt ol</button>
    </div>
  </form>

  <form id="verify" class="auth" hidden>
    <h2>E-postanı onayla</h2>
    <p class="auth-info"><b id="verify-email"></b> adresine bir onay kodu gönderdik. Kodu aşağıya yaz.</p>
    <label>Onay kodu
      <input type="text" id="verify-code" inputmode="numeric" autocomplete="one-time-code"
             required pattern="[0-9]{6,10}" title="E-postadaki rakamlardan oluşan kod">
    </label>
    <button type="submit" id="verify-submit">Onayla</button>
    <div class="auth-error" id="verify-error"></div>
    <div class="auth-switch">
      <button type="button" id="verify-resend">Kodu tekrar gönder</button> ·
      <button type="button" id="verify-back">Geri dön</button>
    </div>
  </form>

  <div id="main" hidden>
  <form id="form">
    <input type="text" id="input" placeholder="Yeni görev ekle..." autocomplete="off">
    <button type="submit">Ekle</button>
  </form>

  <div class="filters">
    <button data-f="all" class="active">Tümü</button>
    <button data-f="active">Aktif</button>
    <button data-f="done">Tamamlanan</button>
  </div>

  <ul id="list"></ul>

  <div class="footer">
    <span id="count"></span>
    <button id="clear">Tamamlananları sil</button>
  </div>
  <div class="hint">Düzenlemek için göreve çift tıkla · Veriler Supabase'de saklanır</div>
  </div>
  <div class="hint" id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // --- Supabase ayarları ---
  const SB_URL = 'https://zoitknfmhsgwynrxvtey.supabase.co';
  const SB_KEY = 'sb_publishable_foYA5psRIXE6v2hWiZLdUg_jc6nhmw7';
  const API = SB_URL + '/rest/v1/todos';

  const client = supabase.createClient(SB_URL, SB_KEY);

  let todos = [];
  let filter = 'all';

  async function sb(method, query = '', body) {
    const { data: { session } } = await client.auth.getSession();
    if (!session) throw new Error('Oturum kapalı');
    const res = await fetch(API + query, {
      method,
      headers: {
        apikey: SB_KEY,
        Authorization: 'Bearer ' + session.access_token,
        'Content-Type': 'application/json',
        Prefer: 'return=representation'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) throw new Error(res.status + ' ' + await res.text());
    return res.status === 204 ? null : res.json();
  }

  function setStatus(msg, isError) {
    const el = $('status');
    el.textContent = msg || '';
    el.style.color = isError ? 'var(--danger)' : 'var(--muted)';
  }

  async function load() {
    setStatus('Yükleniyor...');
    try {
      todos = await sb('GET', '?select=*&order=created_at.desc');
      setStatus('');
    } catch (e) {
      setStatus('Supabase\'e bağlanılamadı: ' + e.message, true);
    }
    render();
  }

  // Değişikliği önce ekranda yapar, sonra Supabase'e yazar; hata olursa listeyi yeniden çeker.
  async function sync(fn) {
    try { await fn(); setStatus(''); }
    catch (e) { setStatus('Kaydedilemedi: ' + e.message, true); await load(); }
  }

  const addTodo = text => {
    const tmp = { id: 'tmp-' + Date.now(), text, done: false };
    todos.unshift(tmp); render();
    sync(async () => {
      const [row] = await sb('POST', '', { text });
      Object.assign(tmp, row); render();
    });
  };
  const updateTodo = (t, patch) => {
    Object.assign(t, patch); render();
    sync(() => sb('PATCH', '?id=eq.' + t.id, patch));
  };
  const removeTodos = list => {
    const ids = list.map(t => t.id);
    todos = todos.filter(t => !ids.includes(t.id)); render();
    if (ids.length) sync(() => sb('DELETE', '?id=in.(' + ids.join(',') + ')'));
  };

  const $ = id => document.getElementById(id);
  $('date').textContent = new Date().toLocaleDateString('tr-TR',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  function render() {
    const list = $('list');
    list.innerHTML = '';
    const shown = todos.filter(t =>
      filter === 'all' ? true : filter === 'done' ? t.done : !t.done);

    if (!shown.length) {
      list.innerHTML = '<div class="empty">' +
        (todos.length ? 'Bu filtrede görev yok.' : 'Henüz görev yok. Yukarıdan ekleyebilirsin.') + '</div>';
    }

    for (const t of shown) {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.done;
      cb.onchange = () => updateTodo(t, { done: cb.checked });

      const span = document.createElement('span');
      span.className = 'text'; span.textContent = t.text;
      span.ondblclick = () => startEdit(li, span, t);

      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕'; del.title = 'Sil';
      del.onclick = () => removeTodos([t]);

      li.append(cb, span, del);
      list.append(li);
    }

    const left = todos.filter(t => !t.done).length;
    $('count').textContent = `${left} görev kaldı`;
    $('clear').style.visibility = todos.some(t => t.done) ? 'visible' : 'hidden';
  }

  function startEdit(li, span, t) {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'edit'; inp.value = t.text;
    li.replaceChild(inp, span);
    inp.focus(); inp.select();
    let finished = false;
    const finish = (commit) => {
      if (finished) return; finished = true;
      const v = inp.value.trim();
      if (!commit || v === t.text) return render();
      if (v) updateTodo(t, { text: v }); else removeTodos([t]);
    };
    inp.onkeydown = e => {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    };
    inp.onblur = () => finish(true);
  }

  $('form').onsubmit = e => {
    e.preventDefault();
    const v = $('input').value.trim();
    if (!v) return;
    $('input').value = '';
    addTodo(v);
  };

  document.querySelectorAll('.filters button').forEach(b => {
    b.onclick = () => {
      filter = b.dataset.f;
      document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
      render();
    };
  });

  $('clear').onclick = () => removeTodos(todos.filter(t => t.done));

  // --- Giriş / kayıt ---
  let signupMode = false;
  let pendingEmail = '';
  const authErrors = {
    'Invalid login credentials': 'E-posta veya şifre hatalı.',
    'User already registered': 'Bu e-posta ile zaten bir hesap var.',
    'Signups not allowed for this instance': 'Yeni kayıtlar kapalı.',
    'Password should be at least 8 characters.': 'Şifre en az 8 karakter olmalı.',
    'Token has expired or is invalid': 'Kod hatalı ya da süresi dolmuş.',
    'Email not confirmed': 'E-posta henüz onaylanmadı.',
    'Unable to validate email address: invalid format': 'Geçerli bir e-posta adresi yaz.',
    'Error sending confirmation email': 'Onay e-postası gönderilemedi. Biraz sonra tekrar dene.'
  };
  const trError = err => {
    if (/only request this after|rate limit/i.test(err.message))
      return 'Çok sık denedin. Bir dakika bekleyip tekrar dene.';
    return authErrors[err.message] || err.message;
  };

  function setMode(signup) {
    signupMode = signup;
    $('auth-title').textContent = signup ? 'Kayıt ol' : 'Giriş yap';
    $('auth-submit').textContent = signup ? 'Kayıt ol' : 'Giriş yap';
    $('auth-switch-text').textContent = signup ? 'Zaten hesabın var mı?' : 'Hesabın yok mu?';
    $('auth-switch').textContent = signup ? 'Giriş yap' : 'Kayıt ol';
    $('auth-pass').autocomplete = signup ? 'new-password' : 'current-password';
    $('auth-pass2-row').hidden = !signup;
    $('auth-pass2').required = signup;
    $('auth-error').textContent = '';
  }
  $('auth-switch').onclick = () => setMode(!signupMode);

  function showVerify(email) {
    pendingEmail = email;
    $('verify-email').textContent = email;
    $('verify-code').value = '';
    $('verify-error').textContent = '';
    $('auth').hidden = true;
    $('verify').hidden = false;
    $('verify-code').focus();
  }
  function showLogin() {
    $('verify').hidden = true;
    $('auth').hidden = false;
    $('auth-email').focus();
  }

  $('auth').onsubmit = async e => {
    e.preventDefault();
    const email = $('auth-email').value.trim().toLowerCase();
    const password = $('auth-pass').value;
    if (signupMode && password !== $('auth-pass2').value) {
      $('auth-error').textContent = 'Şifreler aynı değil.';
      return;
    }
    $('auth-submit').disabled = true;
    $('auth-error').textContent = '';
    let error, data;
    if (signupMode) {
      ({ data, error } = await client.auth.signUp({ email, password }));
      // Onaylanmış bir e-posta tekrar kaydedilirse Supabase hata vermez, boş kimlikle döner.
      if (!error && data.user && data.user.identities?.length === 0)
        error = { message: 'User already registered' };
    } else {
      ({ error } = await client.auth.signInWithPassword({ email, password }));
      if (error?.message === 'Email not confirmed') {
        // Onaylanmamış hesap: yeni kod gönder ve onay ekranına geç.
        await client.auth.resend({ type: 'signup', email });
        error = null; data = { needsVerify: true };
      }
    }
    $('auth-submit').disabled = false;
    if (error) { $('auth-error').textContent = trError(error); return; }
    $('auth-pass').value = ''; $('auth-pass2').value = '';
    if (signupMode || data?.needsVerify) showVerify(email);
  };

  $('verify').onsubmit = async e => {
    e.preventDefault();
    $('verify-submit').disabled = true;
    $('verify-error').textContent = '';
    const { error } = await client.auth.verifyOtp({
      email: pendingEmail, token: $('verify-code').value.trim(), type: 'email'
    });
    $('verify-submit').disabled = false;
    if (error) $('verify-error').textContent = trError(error);
    // Başarılıysa oturum açılır, onAuthStateChange listeyi gösterir.
  };

  $('verify-resend').onclick = async () => {
    $('verify-error').textContent = '';
    const { error } = await client.auth.resend({ type: 'signup', email: pendingEmail });
    $('verify-error').style.color = error ? '' : 'var(--muted)';
    $('verify-error').textContent = error ? trError(error) : 'Yeni kod gönderildi.';
    setTimeout(() => { $('verify-error').style.color = ''; }, 4000);
  };
  $('verify-back').onclick = () => { setMode(false); showLogin(); };

  $('logout').onclick = () => client.auth.signOut();

  let currentUserId;  // undefined = henüz bir şey gösterilmedi
  function showSession(session) {
    const user = session?.user || null;
    const id = user ? user.id : null;
    if (id === currentUserId) return;
    currentUserId = id;
    $('auth').hidden = !!user;
    $('verify').hidden = true;
    $('main').hidden = !user;
    $('user').hidden = !user;
    if (user) {
      $('username').textContent = user.email;
      load();
      $('input').focus();
    } else {
      todos = []; render(); setStatus('');
      setMode(false);
      $('auth-email').focus();
    }
  }

  client.auth.onAuthStateChange((_event, session) => setTimeout(() => showSession(session), 0));
  client.auth.getSession().then(({ data }) => showSession(data.session));
</script>
</body>
</html>
